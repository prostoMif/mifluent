# Git hooks. Installed by `npm install` via the prepare script.
# Skip a hook once with:  LEFTHOOK=0 git commit ...

pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,mjs,cjs,ts,mts,cts,jsx,tsx,json,jsonc,css}"
      run: npx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    typecheck:
      glob: "*.{ts,mts,cts,tsx}"
      run: npm run typecheck

    # Catches the obvious ones before they reach a public repository.
    # Not a substitute for the CI secret scanner.
    secrets:
      glob: "*.{js,mjs,cjs,ts,mts,cts,jsx,tsx,json,yml,yaml,env,md}"
      run: |
        if grep -nEI '(sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' {staged_files}; then
          echo ""
          echo "A staged file looks like it contains a real credential."
          echo "Remove it. Secrets belong in environment variables only."
          exit 1
        fi

commit-msg:
  commands:
    conventional-commits:
      run: |
        pattern='^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9/-]+\))?!?: .{1,}'
        if ! head -n1 {1} | grep -qE "$pattern"; then
          echo "Commit message does not follow Conventional Commits."
          echo ""
          echo "  <type>(<optional scope>): <description>"
          echo ""
          echo "  types: feat fix docs refactor perf test build ci chore revert"
          echo "  example: feat(ingestion): add Hacker News connector"
          echo ""
          echo "See CONTRIBUTING.md."
          exit 1
        fi
