# Публичный радар, русский: площадки и сервисы, которыми платят малые бизнесы в РФ.
# Страница тарифов (сравнивается дважды в день) и поиск новостей об изменениях.
# После правки — `npm run radar:sync`.
profile:
  name: "Радар — площадки и сервисы РФ"
  language: ru
  description: >-
    Публичный журнал изменений тарифов, комиссий, правил и условий у площадок и
    сервисов, которыми пользуются малые бизнесы в России: маркетплейсы, доставка,
    CRM, конструкторы сайтов, реклама, платежи. Важно: рост или снижение цен и
    комиссий, новые и отменённые тарифы, лимиты, правила для продавцов, штрафы,
    сроки вступления в силу. Не важно: инвестиции, найм, мнения, обучающие статьи.
