      - { type: feed, url: "https://www.figma.com/release-notes/feed/atom.xml", label: "Changelog", interval_minutes: 360 }
      - { type: query, url: "https://news.google.com/rss/search?q=%22Figma%22%20pricing%20OR%20plan%20OR%20price&hl=en-US&gl=US&ceid=US:en", label: "News: pricing", interval_minutes: 360 }
