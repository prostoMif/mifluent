# The public radar, English: SaaS tools people pay for.
# Each company: its pricing page (diffed twice a day) and a news search for its
# price and plan changes. `npm run radar:sync` after editing.
profile:
  name: "Radar — SaaS (en)"
  language: en
  description: >-
    A public log of pricing, plan, policy and major feature changes at well-known
    SaaS companies. Relevant: price increases or cuts, new or removed plans, seat
    and usage limits, free tier changes, terms and policy changes, and launches that
    change what a plan includes. Not relevant: funding, hiring, opinion pieces,
    tutorials, or general company news.
companies:
  - name: "Notion"
    website: "https://www.notion.com"
    category: "productivity"
    surfaces:
      - { type: diff, url: "https://www.notion.com/pricing", label: "Pricing page", interval_minutes: 720 }
      - { type: query, url: "https://news.google.com/rss/search?q=%22Notion%22%20pricing%20OR%20plan%20OR%20price&hl=en-US&gl=US&ceid=US:en", label: "News: pricing", interval_minutes: 360 }
  - name: "Figma"
